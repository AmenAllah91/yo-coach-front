worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    gzip on;
    gzip_comp_level 5;
    gzip_types
            text/plain
            text/css
            application/javascript
            application/x-javascript
            text/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml
            font/ttf
            font/woff
            font/woff2;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen 4200;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
                    expires 6M;
                    access_log off;
                    add_header Cache-Control "public";
                }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
