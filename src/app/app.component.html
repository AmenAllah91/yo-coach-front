<div class="loader-wrapper" *ngIf="isLoading | async">
  <div class="spinner"></div>
</div>

<!-- Toast Container -->
<div class="toast-container">
  <div 
    *ngFor="let toast of toastService.toasts$ | async" 
    class="toast"
    [class]="'toast-' + toast.type">
    <div class="toast-icon">
      <i class="fas" [class]="getToastIcon(toast.type)"></i>
    </div>
    <div class="toast-content">
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-message" *ngIf="toast.message">{{ toast.message }}</div>
    </div>
    <button class="toast-close" (click)="toastService.remove(toast.id)">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>

<section *ngIf="coachingAccess.blocked$ | async; else available" role="alert" class="coaching-unavailable">
  <h1>Coaching access unavailable</h1>
  <p>Your profile is currently archived by your coach. Your coaching content is temporarily unavailable. Please contact your coach to reactivate your access.</p>
  <button type="button" (click)="retryCoachingAccess()">Check access</button>
</section>
<ng-template #available><router-outlet></router-outlet></ng-template>
