<app-header [sidebarOpen]="isSidebarOpen" (sidebarToggle)="toggleSidebar()"></app-header>

<div class="layout-body" [class.sidebar-open]="isSidebarOpen">
  <!-- Spacer fantôme qui pousse le contenu -->
  <div class="sidebar-spacer" [class.closed]="!isSidebarOpen"></div>

  <button
    type="button"
    class="sidebar-backdrop"
    [class.visible]="isSidebarOpen"
    (click)="closeSidebar()"
    [attr.aria-label]="'CLOSE_SIDEBAR' | translate">
  </button>

  <app-sidebar #sidebar (sidebarToggle)="handleSidebarToggle($event)"></app-sidebar>

  <div class="content">
    <!-- SUB-30: trial ending, late payment, read-only account. -->
    <app-subscription-banner></app-subscription-banner>
    <router-outlet></router-outlet>
  </div>
</div>

<!-- SUB-29: subscription refusals (client limit, paid branding, blocked account). -->
<app-subscription-notice></app-subscription-notice>
