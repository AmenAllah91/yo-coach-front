<app-header [sidebarOpen]="isSidebarOpen" (sidebarToggle)="toggleSidebar()"></app-header>

<div class="layout-body" [class.sidebar-open]="isSidebarOpen">
  <!-- Spacer fantôme qui pousse le contenu -->
  <div class="sidebar-spacer" [class.closed]="!isSidebarOpen"></div>

  <button
    type="button"
    class="sidebar-backdrop"
    [class.visible]="isSidebarOpen"
    (click)="closeSidebar()"
    aria-label="Close sidebar">
  </button>

  <app-sidebar #sidebar (sidebarToggle)="handleSidebarToggle($event)"></app-sidebar>

  <div class="content">
    <app-back-button></app-back-button>
    <router-outlet></router-outlet>
  </div>
</div>
