<div class="top-bar d-flex align-items-center justify-content-between px-4 py-3">
  <!-- Titre de la page -->
  <div class="page-title d-flex align-items-center">
    <h4 class="mb-0 title-size">{{ 'ALL_CUSTOMERS' | translate }}</h4>
    <i class="fas fa-chevron-down ms-2"></i>
  </div>

  <!-- Boutons et actions -->
  <div class="actions d-flex align-items-center gap-3">
    <button class="btn btn-outline-primary d-flex align-items-center">
      <i class="fas fa-plus me-2"></i> {{ 'NEW' | translate }}
    </button>
    <button class="btn btn-primary d-flex align-items-center">
      <i class="fas fa-user-plus me-2"></i> {{ 'SAVE' | translate }}
    </button>
  </div>
</div>

<div class="main-content">

  <form >

<div class="datepicker-size">
  <label for="planName">{{ 'DATE' | translate }}<span class="text-danger">*</span></label>
  <div class="col-12">
    <div class="input-group-date">
      <input
        class="form-control"
        placeholder="yyyy-mm-dd"
        name="dp"
        ngbDatepicker
        #d="ngbDatepicker"/>
      <button class="btn btn-outline-secondary bi bi-calendar3" (click)="d.toggle()" type="button">
        <i class="fa fa-calendar" ></i></button>
            </div>
  </div>
</div>

    <div class="form-group position-relative">
      <div style="position: relative;">
        <i class="fas fa-search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
        <input type="password" class="form-control" [placeholder]="'SEARCH' | translate" name="password"
               style="padding-left: 35px;" required>
      </div>
    </div>

  <div class="form-group position-relative">
    <label>{{ 'YOUR_EMAIL' | translate }} <span class="text-danger">*</span></label>
    <div style="position: relative;">
      <i class="fas fa-user" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
      <input type="email" class="form-control" [placeholder]="'EMAIL' | translate" name="email" style="padding-left: 35px;" required>
    </div>
  </div>

  <div class="form-group position-relative">
    <label>{{ 'PASSWORD' | translate }} <span class="text-danger">*</span></label>
    <div style="position: relative;">
      <i class="fas fa-key" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
      <input type="password" class="form-control" [placeholder]="'PASSWORD' | translate" name="password"
             style="padding-left: 35px;" required>
    </div>
  </div>

          <!-- Plan Name -->
  <div class="form-group " >
    <label for="planName">{{ 'PLAN_NAME' | translate }}<span class="required">*</span></label>
    <input type="text" id="planName" placeholder="Coaching Basic (0-5 clients)" class="form-control hauteur-input" required>
  </div>

  <!-- Plan Code -->
  <div class="form-group">
    <label for="planCode">{{ 'PLAN_CODE' | translate }}<span class="required">*</span></label>
    <input type="text" class="form-control hauteur-input" id="planCode" placeholder="COACH_BEG" required>
    <small class="form-text">{{ 'PLAN_CODE_HINT' | translate }}</small>
  </div>


  <div class="form-group">
    <label>{{ 'ONE_CHOICE_NO_SEARCH' | translate }}</label>

    <ng-select [items]="items"
               [multiple]="false"
               [closeOnSelect]="true"
               [clearable]="false"
               [searchable]="false"
               class="select-item hauteur-input"
               bindLabel="name"
               [placeholder]="'SELECT_YOUR_PRODUCT' | translate">
    </ng-select>
    <small class="form-text">{{ 'PLAN_TAX_HINT' | translate }}</small>
  </div>

  <div class="form-group">
    <label>{{ 'ONE_CHOICE_WITH_SEARCH' | translate }}</label>

    <ng-select [items]="items"
               [multiple]="false"
               [closeOnSelect]="true"
               [clearable]="false"
               [searchable]="true"
               class="select-item hauteur-input"
               bindLabel="name"
               >
    </ng-select>
    <small class="form-text">{{ 'PLAN_TAX_HINT' | translate }}</small>
  </div>

  <div class="form-group">
    <label>{{ 'MULTI_ITEM_SEARCHABLE' | translate }}</label>

    <ng-select [items]="items"
               [multiple]="true"
               [closeOnSelect]="true"
               [clearable]="false"
               [searchable]="true"
               class="select-item hauteur-input"
               bindLabel="name"
               [placeholder]="'SELECT_YOUR_PRODUCT' | translate">
    </ng-select>
    <small class="form-text">{{ 'PLAN_TAX_HINT' | translate }}</small>
  </div>
  <!-- Price -->
  <div class="form-group ">
    <label for="price">{{ 'PRICE' | translate }}<span class="required">*</span></label>
    <div class="input-group">
      <span class="input-group-text">TND</span>
      <input type="text" class="form-control hauteur-input" id="price" placeholder="39.99" required >
    </div>
  </div>

  <!-- Bill Every -->
  <div class="form-group bill-group">
    <label>{{ 'BILL_EVERY' | translate }}<span class="required">*</span></label>
    <div class="flex-input">
      <input type="number" class="form-control hauteur-input" value="1" >
      <select >
        <option>{{ 'MONTHS' | translate }}</option>
        <option>{{ 'YEARS' | translate }}</option>
      </select>
    </div>
  </div>

  <!-- Billing Cycles -->
  <div class="form-group">
    <label>{{ 'BILLING_CYCLES' | translate }}<span class="required">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="billingCycle" checked> {{ 'AUTO_RENEWS_UNTIL_CANCELED' | translate }}</label>
      <label><input type="radio" name="billingCycle"> {{ 'EXPIRES_AFTER_SPECIFIED' | translate }}</label>
    </div>
  </div>

  <!-- Free Trial -->
  <div class="form-group">
    <label for="freeTrial">{{ 'FREE_TRIAL' | translate }}</label>
    <input type="number" class="form-control hauteur-input" id="freeTrial" placeholder="30" >
    <small class="form-text">{{ 'BASIC_FORM_IN_DAYS' | translate }}</small>
  </div>

  <!-- Setup Fee -->
  <div class="form-group">
    <label for="setupFee">{{ 'SETUP_FEE' | translate }}</label>
    <input type="text" class="form-control hauteur-input" id="setupFee" >
  </div>

  <!-- Type -->
  <div class="form-group">
    <label>{{ 'TYPE' | translate }}<span class="required">*</span></label>
    <div class="radio-group">
      <label><input type="radio" name="type"> {{ 'GOODS' | translate }}</label>
      <label><input type="radio" name="type" checked> {{ 'SERVICE' | translate }}</label>
    </div>
  </div>

<div class="flex-input">
  <small class="form-text">{{ 'ARE_YOU_A_TRAINER' | translate }}</small>

  <div class="form-switch me-3 flex-input" style="display: flex; align-items: center; gap: 8px;">

    <input type="checkbox" id="agentSessionToggle">
    <label class="form-switch-label" for="agentSessionToggle" style="margin: 0;"></label>
  </div>

</div>


  <br>
<br>

  <div class="form-buttons">
    <button type="submit" class="btn btn-save">{{ 'SAVE' | translate }}</button>
    <button type="button" class="btn btn-cancel">{{ 'CANCEL' | translate }}</button>
    <button class="btn btn-outline-primary d-flex align-items-center btn-new">
      <i class="fas fa-plus me-2"></i> {{ 'NEW' | translate }}
    </button>
  </div>
  <br>


  </form>
</div>
