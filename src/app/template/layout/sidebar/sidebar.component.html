<aside
  id="app-sidebar"
  class="sidebar"
  [class.expanded]="isExpanded"
  [class.collapsed]="isCollapsed"
  [class.hover-open]="isHoverOpen"
  (mouseenter)="onSidebarMouseEnter()"
  (mouseleave)="onSidebarMouseLeave()">
  <div class="sidebar-header">
    <img
      src="assets/logo/yocoach-logo.svg"
      class="logo logo-full"
      alt="Yo Coach Logo"
    />
    <img
      src="assets/logo/yocoach-logo-yo.svg"
      class="logo logo-mini"
      alt="Yo Coach Logo"
    />
    <button
      type="button"
      class="sidebar-toggle"
      [class.pinned]="isExpanded"
      (click)="toggleSidebar()"
      [attr.aria-label]="(isExpanded ? 'CLOSE_SIDEBAR' : 'OPEN_SIDEBAR') | translate">
      <i-feather name="sidebar"></i-feather>
    </button>
  </div>

  <div class="sidebar-nav">
    <ng-scrollbar [style.height]="listMaxHeight" visibility="hover">
      <ul class="nav-list">
        <ng-container *ngFor="let item of sidebarItems; trackBy: trackByItem">
          <li class="nav-item" [class.active]="item.isActive" [class.has-active-child]="hasActiveChild(item)">
            <!-- Group Title -->
            <ng-container *ngIf="item.groupTitle">
              <div class="nav-group-title">
                {{ item.title | translate }}
              </div>
            </ng-container>

            <!-- Menu Item -->
            <ng-container *ngIf="!item.groupTitle">
              <a *ngIf= "!item.submenu?.length"
                [routerLink]="item.path"
                [class.has-submenu]="item.submenu?.length"
                (click)="toggleSubmenu($event, item)"
                class="nav-link"
                [class.active]="item.isActive">
                <i-feather [name]="item.icon" class="nav-icon"></i-feather>
                <span class="nav-label">{{ item.title | translate }}</span>

                <i-feather *ngIf="isBrandingLocked(item)" name="lock" class="nav-lock" [attr.aria-label]="'BRANDING_PAID_FEATURE' | translate"></i-feather>
                <ng-container *ngIf="item.badge">
                  <span class="nav-badge">
                    {{ item.badge }}
                  </span>
                </ng-container>
              </a>
              <a *ngIf= "item.submenu?.length"
                href="javascript:void(0)"
                [class.has-submenu]="item.submenu?.length"
                (click)="toggleSubmenu($event, item)"
                class="nav-link"
                [class.active]="item.isActive">
                <i-feather [name]="item.icon" class="nav-icon"></i-feather>
                <span class="nav-label">{{ item.title | translate }}</span>

                <ng-container *ngIf="item.badge">
                  <span class="nav-badge">
                    {{ item.badge }}
                  </span>
                </ng-container>

                <ng-container *ngIf="item.submenu?.length">
                  <i-feather
                    name="chevron-down"
                    class="submenu-arrow"
                    [class.expanded]="item.isExpanded">
                  </i-feather>
                </ng-container>
              </a>

              <!-- Submenu -->
              <ng-container *ngIf="item.submenu?.length">
                <ul class="submenu" [class.expanded]="item.isExpanded">
                  <li *ngFor="let subItem of item.submenu; trackBy: trackByItem" class="submenu-item" [class.active]="subItem.isActive">
                    <a
                      [routerLink]="subItem.path"
                      class="submenu-link"
                      (click)="activateSubmenu(item, subItem)">
                      <i-feather [name]="subItem.icon" class="submenu-icon"></i-feather>
                      <span class="submenu-label">{{ subItem.title | translate }}</span>
                      <i-feather *ngIf="isBrandingLocked(subItem)" name="lock" class="nav-lock" [attr.aria-label]="'BRANDING_PAID_FEATURE' | translate"></i-feather>
                    </a>
                  </li>
                </ul>
              </ng-container>
            </ng-container>
          </li>
        </ng-container>
      </ul>
    </ng-scrollbar>
  </div>

  <!-- SUB-21: only during the free trial. -->
  <div class="sidebar-upgrade" *ngIf="trialDaysLeft !== null">
    <a
      class="upgrade-cta"
      [routerLink]="checkoutPath"
      (click)="onUpgradeClick()"
      [attr.title]="'UPGRADE_TO_PAID_PLAN' | translate">
      <i-feather name="zap" class="upgrade-icon"></i-feather>
      <span class="upgrade-copy">
        <strong>{{ 'UPGRADE_TO_PAID_PLAN' | translate }}</strong>
        <small>{{ trialDaysLeftKey | translate: { count: trialDaysLeft } }}</small>
      </span>
    </a>
  </div>

  <div class="sidebar-account">
    <div class="account-menu" *ngIf="accountMenuOpen" (click)="$event.stopPropagation()">
      <button type="button" class="account-menu-item" (click)="openSettings()">
        <i-feather name="settings"></i-feather>
        <span>{{ 'SETTINGS' | translate }}</span>
      </button>
      <button type="button" class="account-menu-item logout" (click)="logout()">
        <i-feather name="log-out"></i-feather>
        <span>{{ 'LOG_OUT' | translate }}</span>
      </button>
    </div>

    <button
      type="button"
      class="account-trigger"
      [attr.aria-expanded]="accountMenuOpen"
      (click)="toggleAccountMenu($event)">
      <img *ngIf="userPhotoUrl; else accountInitials" [src]="userPhotoUrl" (error)="onUserPhotoError()" alt="" />
      <ng-template #accountInitials><span class="account-avatar-fallback">{{ userInitials }}</span></ng-template>
      <span class="account-copy">
        <strong>{{ userFullName }}</strong>
        <small>{{ userRoleKey | translate }}</small>
      </span>
      <i-feather name="chevron-up" [class.open]="accountMenuOpen"></i-feather>
    </button>
  </div>
</aside>
