<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">
      <i-feather name="arrow-left"></i-feather>
    </button>
    <div class="header-content">
      <h1>Clients</h1>
      <p>Invite and manage your clients</p>
    </div>
    <button class="primary-btn" (click)="openAddModal()">
      <i-feather name="plus"></i-feather>
      Add Client
    </button>
  </div>

  <div class="content">
    <div class="search-section">
      <div class="search-box">
        <i-feather name="search" class="search-icon"></i-feather>
        <input
          type="text"
          placeholder="Search clients"
          [(ngModel)]="searchTerm"
          (input)="onSearch()">
      </div>
    </div>

    <div class="clients-table">
      <div class="table-header">
        <div class="col-client">CLIENT</div>
        <div class="col-workouts">WORKOUTS LAST 7 DAYS</div>
        <div class="col-status">STATUS</div>
        <div class="col-actions"></div>
      </div>

      <div class="table-body">
        <div class="client-row" *ngFor="let client of filteredClients">
          <div class="col-client">
            <div class="client-info">
              <div class="client-avatar">
                <img [src]="'https://ui-avatars.com/api/?name=' + client.firstName + '+' + client.lastName + '&background=0ea5e9&color=fff'"
                     [alt]="client.firstName + ' ' + client.lastName">
              </div>
              <div class="client-details">
                <h4>{{ client.firstName }} {{ client.lastName }}</h4>
                <p>{{ getClientProgram(client) }}</p>
              </div>
            </div>
          </div>

          <div class="col-workouts">
            <div class="workout-calendar">
              <div
                class="workout-day"
                *ngFor="let day of [0,1,2,3,4,5,6]"
                [class.has-workout]="hasWorkoutOnDay(client, day)">
                <div class="day-name">{{ getDayName(day) }}</div>
                <div class="day-number">{{ getDayNumber(day) }}</div>
              </div>
            </div>
          </div>

          <div class="col-status">
            <span class="status-badge" [class]="getClientStatus(client).toLowerCase()">
              {{ getClientStatus(client) }}
            </span>
          </div>

          <div class="col-actions">
            <div class="dropdown" [class.open]="openDropdownId === client.id">
              <button class="action-btn" (click)="toggleDropdown(client.id, $event)">
                <i-feather name="more-horizontal"></i-feather>
              </button>
              <div class="dropdown-menu">
                <button class="dropdown-item" (click)="viewProfile(client)">
                  <i-feather name="user"></i-feather>
                  View Profile
                </button>
                <button class="dropdown-item" (click)="sendMessage(client)">
                  <i-feather name="message-square"></i-feather>
                  Send Message
                </button>
                <button class="dropdown-item" (click)="createWorkoutPlan(client)">
                  <i-feather name="plus"></i-feather>
                  Create Workout Plan
                </button>
                <button class="dropdown-item delete" (click)="deleteClient(client); $event.stopPropagation()">
                  <i-feather name="trash-2"></i-feather>
                  Delete Client
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <app-scroll-loader [isLoading]="isLoading" loadingText="Loading clients..."></app-scroll-loader>

      <div class="pagination" *ngIf="totalPages > 1">
        <button (click)="previousPage()" [disabled]="currentPage === 0">Previous</button>
        <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1">Next</button>
      </div>

      <div class="no-clients" *ngIf="filteredClients.length === 0 && !isLoading">
        <p>No clients found.</p>
      </div>
    </div>
  </div>

  <!-- Add Client Modal -->
  <app-add-client-modal
    [isVisible]="showAddModal"
    (onClose)="closeAddModal()"
    (onCreate)="onCreateClient($event)">
  </app-add-client-modal>

  <!-- Delete Client Modal -->
  <app-delete-client-modal
    [isVisible]="showDeleteModal"
    [clientName]="clientToDelete?.firstName + ' ' + clientToDelete?.lastName"
    (onClose)="closeDeleteModal()"
    (onConfirm)="confirmDelete()">
  </app-delete-client-modal>
</div>
