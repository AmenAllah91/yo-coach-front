<div *ngIf="current as a" class="announcement" [attr.data-level]="a.level"
     [attr.role]="a.level === 'URGENT' ? 'alert' : 'status'">
  <i-feather [name]="icon(a.level)" class="announcement-icon"></i-feather>
  <p class="announcement-text" dir="auto">{{ text(a) }}</p>
  <ng-container *ngIf="a.linkUrl as link">
    <a *ngIf="isAppPath(link)" class="announcement-link" [routerLink]="link">{{ 'ANNOUNCEMENT_LEARN_MORE' | translate }}</a>
    <a *ngIf="!isAppPath(link)" class="announcement-link" [href]="link" target="_blank" rel="noopener noreferrer">
      {{ 'ANNOUNCEMENT_LEARN_MORE' | translate }}<i-feather name="external-link"></i-feather>
    </a>
  </ng-container>
  <div *ngIf="count > 1" class="announcement-pager">
    <button type="button" (click)="move(-1)" [attr.aria-label]="'ANNOUNCEMENT_PREVIOUS' | translate">
      <i-feather name="chevron-left"></i-feather>
    </button>
    <span>{{ index + 1 }}/{{ count }}</span>
    <button type="button" (click)="move(1)" [attr.aria-label]="'ANNOUNCEMENT_NEXT' | translate">
      <i-feather name="chevron-right"></i-feather>
    </button>
  </div>
  <button *ngIf="a.dismissible" type="button" class="announcement-close" (click)="close()"
          [attr.aria-label]="'ANNOUNCEMENT_CLOSE' | translate" [title]="'ANNOUNCEMENT_CLOSE' | translate">
    <i-feather name="x"></i-feather>
  </button>
</div>
