<div class="video-page">
  <header class="video-header">
    <div class="title-block">
      <p>{{ 'EXERCISE_VIDEO' | translate }}</p>
      <h1>{{ displayTitle }}</h1>
    </div>
  </header>

  <main class="video-content">
    <section class="hero-card">
      <div class="loading-card" *ngIf="loadingShort">
        <div class="loader"></div>
        <h2>{{ 'OPENING_SHORTS_VIDEO' | translate }}</h2>
        <p>{{ 'VIDEO_OPEN_VIEWER' | translate }}</p>
      </div>

      <div class="player-card" *ngIf="!loadingShort && videoUrl; else invalidVideo">
        <iframe
          [src]="videoUrl"
          [title]="'EXERCISE_VIDEO' | translate"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>

      <ng-template #invalidVideo>
        <div class="error-card" *ngIf="!loadingShort">
          <div class="error-icon">!</div>
          <h2>{{ 'VIDEO_UNAVAILABLE' | translate }}</h2>
          <p>{{ 'VIDEO_LINK_INVALID' | translate }}</p>
        </div>
      </ng-template>
    </section>
  </main>
</div>
