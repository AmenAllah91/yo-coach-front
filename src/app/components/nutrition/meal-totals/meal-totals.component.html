<section class="mt" [attr.aria-label]="title | translate">
  <header class="mt__head">
    <div class="mt__title">
      <strong>{{ title | translate }}</strong>
      <small>
        {{ 'MEAL_TOTAL_ITEMS' | translate:{ count: itemCount } }}
        <ng-container *ngIf="showServingSwitch && perServing"> · {{ 'MEAL_TOTAL_ONE_SERVING' | translate }}</ng-container>
      </small>
    </div>
    <div class="mt__switch" *ngIf="showServingSwitch" role="group">
      <button type="button" [class.active]="!perServing" [attr.aria-pressed]="!perServing" (click)="setPerServing(false)">
        {{ 'MEAL_TOTAL_WHOLE' | translate }}
      </button>
      <button type="button" [class.active]="perServing" [attr.aria-pressed]="perServing" (click)="setPerServing(true)">
        {{ 'MEAL_TOTAL_PER_SERVING' | translate }}
      </button>
    </div>
  </header>

  <!-- Donut like MyFitnessPal: calories in the middle, each macro's share of the calories around it. -->
  <app-macro-chart class="mt__chart" [calories]="calories" [protein]="protein" [carbs]="carbs" [fat]="fat"></app-macro-chart>
</section>
