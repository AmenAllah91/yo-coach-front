<div class="meal-editor-route-state" *ngIf="loading">{{ 'LOADING_MEAL' | translate }}</div>
<div class="meal-editor-route-state meal-editor-route-state--error" *ngIf="loadError">
  {{ loadError | translate }}
  <button type="button" (click)="close()">{{ 'BACK_TO_MEALS' | translate }}</button>
</div>

<app-add-meal-modal
  [isVisible]="modalVisible"
  [meal]="meal"
  (closed)="close()"
  (saved)="saved()"
></app-add-meal-modal>
