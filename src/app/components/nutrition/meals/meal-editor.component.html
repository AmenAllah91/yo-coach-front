<div class="meal-editor-route-state" *ngIf="loading">Loading meal...</div>
<div class="meal-editor-route-state meal-editor-route-state--error" *ngIf="loadError">
  {{ loadError }}
  <button type="button" (click)="close()">Back to meals</button>
</div>

<app-add-meal-modal
  [isVisible]="modalVisible"
  [meal]="meal"
  (closed)="close()"
  (saved)="saved()"
></app-add-meal-modal>
