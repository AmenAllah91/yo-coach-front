<div
  class="modal-overlay"
  [class.show]="shouldShowModal"
  *ngIf="shouldShowModal"
  (click)="closeModal()"
>
  <div class="modal-content choose-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Choose how to set macros</h2>

      <button class="close-btn" type="button" (click)="closeModal()">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <div class="modal-body">
      <div class="plan-options" *ngIf="hasAnyMacroPlanType; else noMacroTypes">
        <div
          class="plan-option"
          *ngIf="canCreateMacroDailyPlan"
          (click)="selectTotalForDay()"
        >
          <h3>Total for day</h3>
          <p>Set total macros for the entire day.</p>

          <button
            class="btn-primary"
            type="button"
            (click)="selectTotalForDay(); $event.stopPropagation()"
          >
            Select Total for Day
          </button>
        </div>

        <div
          class="plan-option"
          *ngIf="canCreateMacroEachMealPlan"
          (click)="selectEachMeal()"
        >
          <h3>Each meal</h3>
          <p>Set macros for each individual meal.</p>

          <button
            class="btn-primary"
            type="button"
            (click)="selectEachMeal(); $event.stopPropagation()"
          >
            Select Each Meal
          </button>
        </div>
      </div>

      <ng-template #noMacroTypes>
        <div class="plan-option">
          <h3>No macro plan types enabled</h3>
          <p>
            Enable Macro Plan — Daily or Macro Plan — Each Meal from Coach Settings.
          </p>
        </div>
      </ng-template>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" type="button" (click)="closeModal()">
        Cancel
      </button>
    </div>
  </div>
</div>
