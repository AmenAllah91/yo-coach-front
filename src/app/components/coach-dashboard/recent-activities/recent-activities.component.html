<section class="widget" aria-labelledby="recent-activities-title">
  <header class="widget-header">
    <span class="widget-icon"><i-feather name="activity"></i-feather></span>
    <div class="widget-heading">
      <h2 id="recent-activities-title">{{ 'CDASH.RECENT_ACTIVITIES' | translate }}</h2>
      <p>{{ (clientId ? 'CDASH.RECENT_ACTIVITIES_HINT_CLIENT' : 'CDASH.RECENT_ACTIVITIES_HINT') | translate }}</p>
    </div>
    <a class="header-link" routerLink="/coach-dashboard/activities" [queryParams]="allParams">
      {{ 'CDASH.SEE_ALL' | translate }} <span aria-hidden="true">→</span>
    </a>
  </header>

  <div class="chips" role="group" [attr.aria-label]="'CDASH.FILTER' | translate">
    <button type="button" class="chip" [class.chip--active]="category === null" [attr.aria-pressed]="category === null"
            (click)="select(null)">{{ 'CDASH.CAT.ALL' | translate }}</button>
    <button type="button" class="chip" *ngFor="let item of categories" [class.chip--active]="category === item"
            [attr.aria-pressed]="category === item" (click)="select(item)">{{ 'CDASH.CAT.' + item | translate }}</button>
  </div>

  <div class="feed-scroll">
  <app-widget-state
    [status]="status"
    [rows]="5"
    [empty]="activities.length === 0"
    [emptyText]="clientId ? 'CDASH.NO_ACTIVITY_CLIENT' : 'CDASH.NO_ACTIVITY'"
    emptyIcon="activity"
    (retry)="load()"
  ></app-widget-state>

  <app-activity-list *ngIf="status === 'ready' && activities.length" [activities]="activities" [lang]="lang" [embedded]="!!clientId"></app-activity-list>

  <!-- Profile: the next activities are added here, without leaving the profile. -->
  <div class="feed-more" *ngIf="fill && status === 'ready' && (nextCursor || moreFailed)">
    <button type="button" class="feed-more__btn" [disabled]="loadingMore" (click)="loadMore()">
      <span *ngIf="loadingMore" class="feed-more__spin" aria-hidden="true"></span>
      {{ (moreFailed ? 'RETRY' : 'CDASH.LOAD_MORE') | translate }}
    </button>
  </div>
  </div>
</section>
