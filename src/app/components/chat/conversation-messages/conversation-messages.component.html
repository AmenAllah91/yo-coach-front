<div class="chat-header">
  <div class="chat-user" (click)="navigateTouserprofile()">
    <img
      [src]="
                  selectedConversation?.avatar && selectedConversation?.avatar !== 'not found' && selectedConversation?.avatar !== ''
                  ? selectedConversation.avatar
                  : '/assets/images/photoprofilvierge.jpg'"
      alt="avatar"
      class="profile-img me-2"
    />
    <div>
      <span>{{ selectedConversation?.name }}</span>
      <div class="chat-header__members" *ngIf="selectedConversation?.isGroup && groupMembers.length">
        <span
          *ngFor="let m of (showAllGroupMembers ? groupMembers : groupMembers.slice(0, 3))"
          class="chat-header__member-chip"
        >{{ m.name }}</span>
        <span
          *ngIf="!showAllGroupMembers && groupMembers.length > 3"
          class="chat-header__member-chip chat-header__member-chip--more"
          (click)="toggleGroupMembers(); $event.stopPropagation()"
        >+{{ groupMembers.length - 3 }} more</span>
      </div>
    </div>
  </div>
  <div>
    <button class="back-btn" (click)="back.emit()" aria-label="Retour">
        <i class="fas fa-arrow-left"></i>
    </button>
    <button class="toggle-button" (click)="toggleSidebar()">✕</button>
  </div>

</div>

<div class="chat-messages" (scroll)="onScroll($event)">
  <div
    class="message"
    *ngFor="let msg of messages"
    [ngClass]="msg.senderId === currentUserId ? 'me' : 'other'"
  >
    <span class="message-sender" *ngIf="selectedConversation?.isGroup && msg.senderId !== currentUserId">{{ getSenderName(msg.senderId) }}</span>
    <div class="message-content">
      {{ msg.content }}
    </div>
    <div class="message-time">
      {{ msg.createdAt | date:'dd MMM yyyy, HH:mm' }}
    </div>
  </div>
</div>

<div class="chat-input">
  <input
    type="text"
    placeholder="Type a message..."
    [(ngModel)]="messageText"
    (keyup.enter)="sendMessage()"
  />
  <button (click)="sendMessage()">Send</button>
</div>
