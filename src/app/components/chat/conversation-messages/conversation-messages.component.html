<div class="chat-header">
  <button class="header-action" type="button" (click)="back.emit()" aria-label="Back to conversations">
    <i-feather name="arrow-left"></i-feather>
  </button>

  <button
    type="button"
    class="chat-user"
    [class.chat-user--clickable]="!selectedConversation?.isGroup"
    (click)="navigateTouserprofile()"
  >
    <img
      [src]="
        selectedConversation?.avatar && selectedConversation?.avatar !== 'not found'
          ? selectedConversation.avatar
          : '/assets/images/photoprofilvierge.jpg'
      "
      alt=""
    />
    <div class="chat-user__info">
      <span class="chat-user__name">{{ selectedConversation?.name }}</span>
      <span class="chat-user__members" *ngIf="selectedConversation?.isGroup">
        {{ selectedConversation?.memberIds?.length || 0 }} members
      </span>
    </div>
  </button>

  <div class="chat-header__actions">
    <button class="header-action" type="button" (click)="expanded.emit()" aria-label="Open full page chat">
      <i-feather name="maximize-2"></i-feather>
    </button>
    <button class="header-action" type="button" (click)="closed.emit()" aria-label="Close conversation">
      <i-feather name="x"></i-feather>
    </button>
  </div>
</div>

<div class="chat-messages" (scroll)="onScroll($event)">
  <div
    class="message"
    *ngFor="let msg of messages"
    [ngClass]="msg.senderId === currentUserId ? 'me' : 'other'"
  >
    <span class="message-sender" *ngIf="selectedConversation?.isGroup && msg.senderId !== currentUserId">
      {{ getSenderName(msg.senderId) }}
    </span>

    <ng-container [ngSwitch]="getMessageType(msg)">
      <div class="message-content" *ngSwitchCase="'TEXT'">{{ msg.content }}</div>

      <div class="message-content message-content--voice" *ngSwitchCase="'VOICE'">
        <div class="voice-bubble">
          <i-feather name="mic"></i-feather>
          <audio [src]="getAttachmentUrl(msg)" controls preload="metadata"></audio>
          <span>{{ formatDuration(msg.durationSeconds) }}</span>
        </div>
      </div>

      <button
        type="button"
        class="message-content message-content--doc"
        *ngSwitchCase="'DOCUMENT'"
        (click)="downloadDocument(msg, $event)"
      >
        <div class="doc-bubble">
          <span class="doc-bubble__icon"><i-feather name="paperclip"></i-feather></span>
          <span class="doc-bubble__info">
            <strong>{{ msg.attachmentName || 'Document' }}</strong>
            <small>{{ msg.attachmentType || 'Document' }} {{ formatFileSize(msg.attachmentSize) }}</small>
          </span>
          <i-feather name="download"></i-feather>
        </div>
      </button>

      <div class="message-content" *ngSwitchDefault>
        {{ msg.content || msg.attachmentName || 'Message' }}
      </div>
    </ng-container>

    <div class="message-caption" *ngIf="getMessageType(msg) === 'DOCUMENT' && msg.content">
      {{ msg.content }}
    </div>

    <div class="message-time">{{ msg.createdAt | date:'dd MMM, HH:mm' }}</div>
  </div>
</div>

<div class="chat-input">
  <input
    #documentInput
    type="file"
    hidden
    [accept]="acceptedDocumentExtensions"
    (change)="onDocumentSelected($event)"
  />

  <div class="pending-attachment" *ngIf="pendingDocument">
    <span class="pending-attachment__icon"><i-feather name="paperclip"></i-feather></span>
    <span class="pending-attachment__info">
      <strong>{{ pendingDocument.name }}</strong>
      <small>{{ formatFileSize(pendingDocument.size) }}</small>
    </span>
    <button type="button" class="pending-attachment__remove" (click)="removePendingDocument()" aria-label="Remove attachment">
      <i-feather name="x"></i-feather>
    </button>
  </div>

  <div class="attachment-error" *ngIf="attachmentError">{{ attachmentError }}</div>

  <div class="chat-input__row">
    <input
      class="message-field"
      type="text"
      [placeholder]="pendingDocument ? 'Add a message...' : 'Write a message...'"
      [(ngModel)]="messageText"
      (keyup.enter)="sendMessage()"
    />

    <div class="composer-actions">
      <button
        type="button"
        class="composer-icon"
        title="Send document"
        (click)="documentInput.click()"
        [disabled]="isUploadingAttachment"
      >
        <i-feather name="paperclip"></i-feather>
      </button>

      <button
        type="button"
        class="composer-icon"
        title="Voice message"
        (click)="toggleVoiceRecording()"
        [class.is-recording]="isRecordingVoice"
        [disabled]="isUploadingAttachment"
      >
        <i-feather [name]="isRecordingVoice ? 'square' : 'mic'"></i-feather>
      </button>

      <button
        type="button"
        class="send-button"
        (click)="sendMessage()"
        [disabled]="isUploadingAttachment || (!messageText.trim() && !pendingDocument)"
      >
        Send
      </button>
    </div>
  </div>
</div>
