<div class="conversation-top">
  <div class="chat-title">
    <div class="chat-title__label">
      <i-feather name="message-circle"></i-feather>
      <span>{{ 'MESSAGING' | translate }}</span>
    </div>
    <button class="header-action" type="button" (click)="closeChat()" [attr.aria-label]="'CLOSE_MESSAGING' | translate">
      <i-feather name="x"></i-feather>
    </button>
  </div>
</div>

<ng-container *ngIf="mode === 'LIST'">
  <div class="section">
    <div class="section-header">
      <span>{{ 'CONVERSATIONS' | translate }}</span>
      <button class="header-action header-action--small" type="button" (click)="switchToAdd()" [attr.aria-label]="'START_CONVERSATION' | translate">
        <i-feather name="plus"></i-feather>
      </button>
    </div>

    <input
      type="text"
      class="search-input"
      [placeholder]="'SEARCH' | translate"
      [(ngModel)]="searchConversation"
      (input)="onSearchConversation()"
    />

    <div class="conversation-list">
      <button
        type="button"
        class="conversation-card"
        *ngFor="let conv of conversations"
        (click)="select(conv)"
        [ngClass]="{'conversation-unread': isLastMessageUnread(conv)}"
      >
        <img *ngIf="conv.avatar" [src]="conv.avatar" alt="" />

        <div *ngIf="!conv.avatar" class="avatar">
          {{ conv.name ? conv.name[0] : '?' }}
        </div>

        <div class="conversation-info">
          <div class="conversation-name">
            {{ conv.name }}
            <span class="badge-group" *ngIf="conv.isGroup">{{ 'GROUP' | translate }}</span>
          </div>
          <div class="conversation-last">
            <span *ngIf="conv.isGroup; else lastMsg">
              {{ conv.memberIds?.length || 0 }} {{ 'MEMBERS' | translate }}
            </span>
            <ng-template #lastMsg>{{ getLastMessageText(conv) }}</ng-template>
          </div>
        </div>

        <span class="badge" *ngIf="getUnreadBadgeCount(conv) > 0">{{ getUnreadBadgeCount(conv) }}</span>
      </button>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="mode === 'ADD'">
  <div class="section">
    <div class="section-header">
      <span>{{ 'START_CONVERSATION' | translate }}</span>
      <button class="header-action header-action--small" type="button" (click)="switchToList()" [attr.aria-label]="'BACK_TO_CONVERSATIONS' | translate">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <input
      type="text"
      class="search-input"
      [placeholder]="'SEARCH' | translate"
      [(ngModel)]="searchUser"
      (input)="searchUsers()"
    />

    <div class="conversation-list" *ngIf="userSuggestions.length">
      <div class="section-subtitle">{{ 'USERS' | translate }}</div>

      <button
        type="button"
        class="conversation-card"
        *ngFor="let user of userSuggestions"
        (click)="createConversationWith(user)"
      >
        <img *ngIf="user.avatarUrl !== 'not found'" [src]="user.avatarUrl" alt="" />

        <div *ngIf="user.avatarUrl === 'not found'" class="avatar">
          {{ user.firstName[0] }}{{ user.lastName[0] }}
        </div>

        <div class="conversation-info">
          <div class="conversation-name">{{ user.firstName }} {{ user.lastName }}</div>
        </div>
      </button>
    </div>
  </div>
</ng-container>
