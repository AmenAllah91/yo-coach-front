<div class="swap-backdrop" *ngIf="show" (click)="onClose()">
  <section class="swap-modal" (click)="$event.stopPropagation()">
    <header class="swap-header">
      <div>
        <h2>Replace food</h2>
        <p>Swap within the {{ replacementGroupLabel }} group</p>
      </div>
      <button type="button" class="swap-close" aria-label="Close" (click)="onClose()">&times;</button>
    </header>

    <div class="swap-body">
      <article class="replacing-card" *ngIf="originalFood">
        <div>
          <small>Replacing</small>
          <strong>{{ originalFood.name }}</strong>
          <span>{{ originalFood.quantity }}</span>
        </div>
        <div class="replacing-calories">
          <strong>{{ originalFood.calories }}</strong>
          <span>kcal</span>
        </div>
      </article>

      <div class="swap-loading" *ngIf="loading">
        <span></span>
        <p>Loading alternatives...</p>
      </div>

      <div class="swap-error" *ngIf="error && !loading">{{ error }}</div>

      <section class="swap-options" *ngIf="alternatives.length && !loading">
        <h3>Choose a swap</h3>
        <div class="swap-options-list">
          <button
            type="button"
            class="swap-option"
            *ngFor="let option of alternatives"
            [class.selected]="selectedFoodId === option.food.foodRefId"
            (click)="selectReplacement(option.food, option.group)"
          >
            <span class="swap-radio"><i></i></span>
            <div class="swap-food">
              <strong>{{ option.food.name }}</strong>
              <small>{{ option.food.quantity || 100 }} {{ option.food.unit || 'g' }}</small>
            </div>
            <div class="swap-macros">
              <div class="swap-kcal"><strong>{{ option.food.energy || 0 }}</strong><small>Kcal</small></div>
              <div><strong>{{ option.food.protein || 0 }}g</strong><small>P</small></div>
              <div><strong>{{ option.food.carbohydrates || 0 }}g</strong><small>C</small></div>
              <div><strong>{{ option.food.fat || 0 }}g</strong><small>F</small></div>
            </div>
          </button>
        </div>
      </section>
    </div>

    <footer class="swap-footer">
      <button type="button" class="swap-cancel" (click)="onClose()">Cancel</button>
      <button type="button" class="swap-confirm" [disabled]="!selectedFoodId || loading" (click)="confirmReplace()">&#8644;&nbsp; Confirm swap</button>
    </footer>
  </section>
</div>
