<!-- Rien n’est affiché tant que l’invitation n’existe pas -->
<div class="inv-root" *ngIf="!loading && invitation">

  <div class="inv-container">

    <!-- Card -->
    <div class="inv-card">

      <!-- Card body -->
      <div class="inv-card__body">

        <!-- Badge circulaire -->
        <div class="inv-logo">
          <img src="assets/yocoachlogo.png"
               alt="YoCoach"
               class="inv-logo__img" />
        </div>

        <!-- Texte invitation -->
        <h1 class="inv-title">
          <strong>{{ invitation.coachName }}</strong>
          {{ 'INVITED_TO_YOCOACH_APP' | translate }}
        </h1>

        <p class="inv-sub">
          {{ 'COMPLETE_SETUP_LINK' | translate }}
        </p>

        <!-- Bouton CTA -->
        <button
          class="inv-cta"
          *ngIf="invitation.status === 'PENDING'"
          (click)="acceptInvitation()">
          {{ 'ACCEPT_INVITATION' | translate }}
        </button>

      </div>

      <!-- Divider -->
      <div class="inv-divider"></div>

      <!-- Fallback link -->
      <div class="inv-fallback">
        <p class="inv-fallback__label">
          {{ 'INVITATION_LINK_FALLBACK' | translate }}
        </p>
        <button
          class="inv-fallback__link"
          (click)="acceptInvitation()">
          {{ 'ACCEPT_INVITATION' | translate }}
        </button>
      </div>

    </div>

    <!-- Footer -->
    <div class="inv-footer">
      <p class="inv-footer__report">
        {{ 'UNKNOWN_COACH_REPORT' | translate }}
        <a href="#" class="inv-footer__link">{{ 'HERE' | translate }}</a>.
      </p>
      <p class="inv-footer__copy">{{ 'YOCOACH_COPYRIGHT' | translate }}</p>
    </div>

  </div>
</div>
