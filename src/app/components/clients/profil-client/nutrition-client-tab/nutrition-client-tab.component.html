<!-- The client's « Programmes » tab (backlog-programmes.md P1-P8) -->
<app-client-programs
  kind="NUTRITION"
  [clientId]="clientId"
  [clientName]="clientName"
  (action)="onProgramAction($event)"
></app-client-programs>

<app-remove-program-confirm
  *ngIf="removeTarget"
  [item]="removeTarget"
  kind="NUTRITION"
  [clientName]="clientName"
  [busy]="removing"
  (confirmed)="confirmRemove()"
  (cancelled)="removeTarget = null"
></app-remove-program-confirm>


<!-- « Décaler la suite » (backlog-programmes.md DS-10) -->
<app-program-shift-modal
  *ngIf="shiftTarget"
  kind="NUTRITION"
  [item]="shiftTarget"
  [clientName]="clientName"
  (closed)="shiftTarget = null"
  (saved)="onShiftSaved()"
></app-program-shift-modal>

<!-- « Modifier les dates »: same rule as an assignment (backlog-programmes.md A8) -->
<app-change-dates-modal
  *ngIf="showChangeDatesModal && dateTargetPlan"
  kind="NUTRITION"
  [plan]="dateTargetPlan"
  [isFile]="dateTargetIsFile"
  [clientId]="clientId"
  [clientName]="clientName"
  (closed)="closeChangeDatesModal()"
  (saved)="onDatesSaved()"
></app-change-dates-modal>
