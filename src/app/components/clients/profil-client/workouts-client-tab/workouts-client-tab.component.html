<!-- The client's « Programmes » tab (backlog-programmes.md P1-P8) -->
<app-client-programs
  kind="WORKOUT"
  [clientId]="clientId"
  [clientName]="clientName"
  (action)="onProgramAction($event)"
></app-client-programs>

<app-remove-program-confirm
  *ngIf="removeTarget"
  [item]="removeTarget"
  kind="WORKOUT"
  [clientName]="clientName"
  [busy]="removing"
  (confirmed)="confirmRemove()"
  (cancelled)="removeTarget = null"
></app-remove-program-confirm>

<div class="upload-file-modal-backdrop" *ngIf="workoutFileEnabled && showUploadFileModal" (click)="closeUploadFileModal()">
  <div class="upload-file-modal import-style-modal" (click)="$event.stopPropagation()">
    <div class="upload-file-modal-header import-style-head">
      <div>
        <h3>{{ 'IMPORT_PROGRAM' | translate }}</h3>
        <p>{{ 'IMPORT_PROGRAM_DESCRIPTION' | translate }}</p>
      </div>
      <button type="button" class="upload-file-close" (click)="closeUploadFileModal()" [attr.aria-label]="'CLOSE' | translate">&times;</button>
    </div>

    <label class="upload-zone">
      <input type="file" accept=".pdf,.xls,.xlsx,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden (change)="onUploadFileSelected($event)" />
      <div class="upload-zone-icon"><i class="fas fa-cloud-upload-alt"></i></div>
      <strong>{{ selectedUploadFile ? selectedUploadFile.name : ('DROP_OR_BROWSE_FILE' | translate) }}</strong>
      <span>{{ 'WORKOUT_FILE_REQUIREMENTS' | translate }}</span>
    </label>

    <div class="upload-error" *ngIf="uploadError">{{ uploadError }}</div>

    <label class="upload-field-label">{{ 'PROGRAM_NAME' | translate }} <b>*</b></label>
    <input class="upload-field" type="text" [(ngModel)]="uploadProgramName" [placeholder]="'IMPORT_PROGRAM_NAME_EXAMPLE' | translate" />

    <label class="upload-field-label">{{ 'DESCRIPTION' | translate }} <em>({{ 'OPTIONAL' | translate }})</em></label>
    <textarea class="upload-field" rows="3" [(ngModel)]="uploadProgramDescription" [placeholder]="'IMPORT_PROGRAM_DESCRIPTION_EXAMPLE' | translate"></textarea>

    <div class="upload-date-grid">
      <div>
        <label class="upload-field-label">{{ 'START_DATE' | translate }}</label>
        <input class="upload-field" type="date" [(ngModel)]="uploadStartDate" />
      </div>
      <div>
        <label class="upload-field-label">{{ 'END_DATE' | translate }}</label>
        <input class="upload-field" type="date" [(ngModel)]="uploadEndDate" />
      </div>
    </div>

    <div class="upload-info">
      <i class="fas fa-info-circle"></i>
      <span>{{ 'PROGRAM_AUTO_ASSIGNED_CLIENT' | translate }}</span>
    </div>

    <div class="upload-file-modal-actions">
      <button type="button" class="upload-cancel-btn" (click)="closeUploadFileModal()" [disabled]="uploadSaving">{{ 'CANCEL' | translate }}</button>
      <button type="button" class="upload-save-btn" (click)="createAndAssignUploadedFile()" [disabled]="!selectedUploadFile || !uploadProgramName.trim() || uploadSaving">
        {{ (uploadSaving ? 'SAVING' : 'SAVE_AND_ASSIGN') | translate }}
      </button>
    </div>
  </div>
</div>


<input
  id="profile-workout-replace-file-input"
  type="file"
  accept=".pdf,.xls,.xlsx,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  hidden
  (change)="onReplaceFileSelected($event)"
/>

<div class="replace-error-banner" *ngIf="replaceError">
  {{ replaceError }}
</div>

<!-- « Décaler la suite » and pause (backlog-programmes.md DS-10/DS-11) -->
<app-program-shift-modal
  *ngIf="shiftTarget"
  kind="WORKOUT"
  [item]="shiftTarget"
  [clientName]="clientName"
  (closed)="shiftTarget = null"
  (saved)="onShiftSaved()"
></app-program-shift-modal>
<app-client-pause-modal
  *ngIf="showPauseModal"
  [clientId]="clientId"
  [clientName]="clientName"
  (closed)="showPauseModal = false"
  (saved)="onShiftSaved()"
></app-client-pause-modal>

<!-- « Modifier les dates »: same rule as an assignment (backlog-programmes.md A8) -->
<app-change-dates-modal
  *ngIf="showChangeDatesModal && dateTargetProgram"
  kind="WORKOUT"
  [plan]="dateTargetProgram"
  [isFile]="dateTargetIsFile"
  [clientId]="clientId"
  [clientName]="clientName"
  (closed)="closeChangeDatesModal()"
  (saved)="onDatesSaved()"
></app-change-dates-modal>
