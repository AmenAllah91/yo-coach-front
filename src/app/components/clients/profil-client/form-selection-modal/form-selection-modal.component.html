<div *ngIf="isOpen" class="assign-modal-overlay">
  <div class="assign-modal select-program-modal">

    <!-- Header -->
    <div class="assign-modal-header">
      <div>
        <h3 class="assign-modal-title">Select Check-in Form</h3>
        <p class="assign-modal-subtitle">
          Choose a form to assign to {{ fullName }}
        </p>
      </div>
      <button type="button" (click)="closeModal.emit()" class="assign-modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="select-program-search">
      <div class="select-search-input">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search forms..." [(ngModel)]="searchTerm" />
      </div>
    </div>

    <div class="date-panel" *ngIf="selectedForm">
      <ng-container *ngIf="!selectedForm.raw?.schedule; else scheduleTpl">

        <div class="am-schedule">

          <label class="am-schedule__row">
            <input
              type="checkbox"
              class="am-sr-only"
              [checked]="scheduleEnabled"
              (change)="scheduleEnabled = !scheduleEnabled"
            />

            <span
              class="am-checkbox am-checkbox--sm"
              [class.am-checkbox--checked]="scheduleEnabled"
            >
        <i-feather
          *ngIf="scheduleEnabled"
          name="check"
          class="am-check-icon"
        ></i-feather>
      </span>

            <span class="am-schedule__label">
        Schedule for a specific date
      </span>
          </label>

          <div class="am-date-wrap" *ngIf="scheduleEnabled">
            <i-feather name="calendar" class="am-date-icon"></i-feather>

            <input
              class="am-date-input"
              type="date"
              [(ngModel)]="dueDateValue"
            />
          </div>

        </div>
      </ng-container>

      <ng-template #scheduleTpl>
        <div class="date-panel-title">End Date *</div>
        <div class="date-panel-row">
          <input class="date-input" type="date" [(ngModel)]="endDateValue" />
        </div>
        <p class="date-panel-hint">
          End Date (required): after this date, no more assignments will be generated.
        </p>
      </ng-template>
    </div>

    <!-- Body -->
    <div class="select-program-body">

      <div *ngIf="loading" style="padding:12px;">Loading...</div>
      <div *ngIf="error && !loading" style="padding:12px; color:#b91c1c;">{{ error }}</div>

      <ng-container *ngIf="!loading && !error">
        <ng-container *ngIf="filteredForms.length; else noForms">
          <div
            class="select-program-card"
            *ngFor="let form of filteredForms"
            [class.select-program-card--selected]="form.id === selectedFormId"
            (click)="selectForm(form)"
          >
            <div class="select-program-main">
              <div class="select-radio">
                <span class="select-radio-inner" *ngIf="form.id === selectedFormId"></span>
              </div>
              <div class="select-program-text">
                <div class="select-program-title-row">
                  <span class="select-program-name">{{ form.name }}</span>
                </div>
                <div class="select-program-meta">
                  <span>
                    <i class="far fa-list-alt"></i>
                    {{ form.questionCount }} questions
                  </span>
                </div>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-template #noForms>
          <div class="select-program-empty">No forms found</div>
        </ng-template>
      </ng-container>

    </div>

    <!-- Footer -->
    <div class="select-program-footer">
      <button type="button" class="btn-secondary" (click)="backClick.emit()">
        Back
      </button>

      <button
        type="button"
        class="btn-primary"
        [class.btn-primary--disabled]="!canAssign()"
        [disabled]="!canAssign()"
        (click)="assign()"
      >
        Assign Form
      </button>
    </div>

  </div>
</div>
