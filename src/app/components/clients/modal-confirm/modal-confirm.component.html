<div class="modal-overlay" [class.show]="show" (click)="closeModal()">
  <div class="modal-content delete" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ 'CONFIRM_PROGRAM' | translate }}</h2>
      <button class="close-btn" (click)="closeModal()">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <div class="modal-body">
      <div class="delete-icon">
        <i-feather name="trash-2" size="24"></i-feather>
      </div>
      <h3>{{ 'ARE_YOU_SURE' | translate }}</h3>
      <p>
        {{ 'CONFIRM_PROGRAM_STATUS' | translate:{status: ((programToConfrim === 'missed' ? 'MISSED' : 'COMPLETED') | translate)} }}
      </p>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="closeModal()">{{ 'CANCEL' | translate }}</button>
      <button class="confirm-btn danger" (click)="confirmDelete()">
        {{ (programToConfrim === 'missed' ? 'MISSED' : 'COMPLETED') | translate }}
      </button>
    </div>
  </div>
</div>
