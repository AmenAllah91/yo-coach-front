<div class="assign-backdrop">
  <div class="assign-modal">
    <!-- HEADER -->
    <div class="assign-header">
      <div>
        <h2 class="assign-title">Assign Program</h2>
        <p class="assign-subtitle">{{ programName }}</p>
      </div>

      <button class="assign-close" type="button" (click)="close()">✕</button>
    </div>

    <!-- START DATE -->
    <div class="assign-section assign-section--grey">
      <label class="assign-label">Start Date *</label>
      <div class="date-wrapper">
        <span class="input-icon-left calendar-icon"></span>

        <input
          type="date"
          class="assign-input assign-input--date"
          [(ngModel)]="startDate"
        />

        <span class="input-icon-right calendar-icon"></span>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="assign-section">
      <div class="input-wrapper input-wrapper--blue">
        <span class="input-icon-left search-icon"></span>
        <input
          type="text"
          class="assign-input assign-input--blue"
          placeholder="Search clients..."
          [(ngModel)]="searchTerm"
        />
      </div>
    </div>

    <!-- LISTE DES CLIENTS -->
    <div class="assign-clients">
      <div
        class="client-card"
        *ngFor="let c of filteredClients"
        [class.selected]="c.selected"
        (click)="onToggleClient(c)"
      >
        <div class="client-check" [class.client-check--checked]="c.selected">
          <span *ngIf="c.selected" class="check-icon">✔</span>
        </div>

        <img
          class="client-avatar"
          src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?auto=format&fit=crop&w=256&q=80"
          [alt]="c.name"
        />

        <div class="client-info">
          <div class="client-name">{{ c.firstName }} {{ c.lastName }}</div>
          <div class="client-email">{{ c.email }}</div>
        </div>
      </div>

      <div *ngIf="filteredClients.length === 0" class="no-results">
        No clients found
      </div>
    </div>

    <!-- SELECTED RECIPIENTS -->
    <div class="assign-summary" *ngIf="selectedClients.length > 0">
      <div class="summary-left">
        <div class="summary-check">✔</div>
      </div>

      <div class="summary-right">
        <div class="summary-title">Selected Recipients</div>

        <div class="summary-chips">
          <!-- Chips dynamiques -->
          <div class="chip" *ngFor="let c of selectedClients">
            <img
              src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?auto=format&fit=crop&w=256&q=80"
              [alt]="c.login"
              class="chip-avatar"
            />
            <span class="chip-label">{{ c.firstName }} {{ c.lastName }}</span>
            <button
              class="chip-remove"
              type="button"
              (click)="onRemoveClientFromChips(c.id); $event.stopPropagation()"
            >
              ✕
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="assign-footer">
      <div class="footer-count">
        {{ selectedCount }}
        client{{ selectedCount > 1 ? "s" : "" }} selected
      </div>

      <div class="footer-actions">
        <button
          type="button"
          class="btn-footer btn-footer--cancel"
          (click)="onCancel()"
        >
          Cancel
        </button>

        <button
          type="button"
          class="btn-footer btn-footer--assign"
          [disabled]="assignDisabled"
          (click)="onAssign()"
        >
          Assign Program
        </button>
      </div>
    </div>
  </div>
</div>
