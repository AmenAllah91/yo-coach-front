<div class="modal-overlay" [class.show]="isVisible" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add New Client</h2>
      <button class="close-btn" (click)="closeModal()">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" [(ngModel)]="firstName" placeholder="Enter first name">
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="lastName" placeholder="Enter last name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter email address">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="gender">
          <option value="MALE">Male</option>
          <option value="FEMALE">Female</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
      <button class="confirm-btn primary" (click)="createClient()">Add Client</button>
    </div>
  </div>
</div>
