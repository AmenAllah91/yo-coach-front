<div class="acm-overlay" *ngIf="isVisible" (click)="closeModal()">
  <div class="acm-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="acm-header">
      <h2 class="acm-title">{{ 'INVITE_NEW_CLIENTS' | translate }}</h2>
      <button class="acm-close" type="button" (click)="closeModal()" [attr.aria-label]="'CLOSE' | translate">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <!-- Body -->
    <div class="acm-body">

      <!-- Description -->
      <p class="acm-desc">
        {{ 'INVITE_CLIENTS_EXPLANATION' | translate }}
        <a href="#" class="acm-link">{{ 'LEARN_MORE' | translate }}</a>
      </p>

      <!-- Invite Link -->
      <div class="acm-invite-box">
        <span class="acm-invite-url">{{ inviteLink }}</span>
        <button type="button" class="acm-copy-btn" (click)="copyLink()">
          <i-feather name="copy" class="acm-copy-ico"></i-feather>
          <span>{{ copied ? ('COPIED' | translate) : ('COPY_LINK' | translate) }}</span>
        </button>
      </div>

      <!-- Email Input -->
      <input
        class="acm-email-input"
        type="email"
        placeholder="client@example.com"
        [(ngModel)]="email"
        name="email"
      />

      <!-- Submit -->
      <button class="acm-submit-btn" type="button" (click)="sendInvitation()" [disabled]="!email.trim()">
        {{ 'SEND_INVITATION' | translate }}
      </button>

    </div>
  </div>
</div>
