<div class="acm-overlay" *ngIf="isVisible" (click)="closeModal()">
  <div class="acm-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="acm-header">
      <h2 class="acm-title">Invite new clients</h2>
      <button class="acm-close" type="button" (click)="closeModal()" aria-label="Fermer">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <!-- Body -->
    <div class="acm-body">

      <!-- Description -->
      <p class="acm-desc">
        Invite one or more clients. They will receive a link to accept your invitation
        and be guided to download the app to be coached.
        <a href="#" class="acm-link">Learn More</a>
      </p>

      <!-- Invite Link -->
      <div class="acm-invite-box">
        <span class="acm-invite-url">{{ inviteLink }}</span>
        <button type="button" class="acm-copy-btn" (click)="copyLink()">
          <i-feather name="copy" class="acm-copy-ico"></i-feather>
          <span>{{ copied ? 'Copied!' : 'Copy Link' }}</span>
        </button>
      </div>

      <!-- Email Input -->
      <input
        class="acm-email-input"
        type="email"
        placeholder="client@example.com"
        [(ngModel)]="email"
        name="email"
      />

      <!-- Submit -->
      <button class="acm-submit-btn" type="button" (click)="sendInvitation()" [disabled]="!email.trim()">
        Send Invitation
      </button>

    </div>
  </div>
</div>
