<div class="acm-overlay" *ngIf="isVisible" (click)="closeModal()">
  <div class="acm-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="acm-header">
      <h2 class="acm-title">{{ 'INVITE_NEW_CLIENTS' | translate }}</h2>
      <button class="acm-close" type="button" (click)="closeModal()" [attr.aria-label]="'CLOSE' | translate">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <!-- Body -->
    <div class="acm-body">

      <!-- Description -->
      <p class="acm-desc">
        {{ 'INVITE_CLIENTS_EXPLANATION' | translate }}
        <a href="#" class="acm-link">{{ 'LEARN_MORE' | translate }}</a>
      </p>

      <!-- Invite Link -->
      <div class="acm-invite-box">
        <span class="acm-invite-url">{{ inviteLink }}</span>
        <button type="button" class="acm-copy-btn" (click)="copyLink()">
          <i-feather name="copy" class="acm-copy-ico"></i-feather>
          <span>{{ copied ? ('COPIED' | translate) : ('COPY_LINK' | translate) }}</span>
        </button>
      </div>

      <!-- Email Input -->
      <div class="acm-email-field">
        <input
          class="acm-email-input"
          [class.acm-email-input--invalid]="!!emailError"
          type="email"
          placeholder="client@example.com"
          [ngModel]="email"
          (ngModelChange)="onEmailChange($event)"
          (blur)="onEmailBlur()"
          [attr.aria-invalid]="!!emailError"
          [attr.aria-describedby]="emailError ? 'acm-email-error' : null"
          name="email"
        />
        <p *ngIf="emailError" id="acm-email-error" class="acm-email-error" role="alert">
          {{ emailError }}
        </p>
        <button
          *ngIf="pendingInvitation"
          class="acm-resend-btn"
          type="button"
          (click)="sendInvitation()"
          [disabled]="isSending"
        >
          {{ (isSending ? 'SENDING' : 'RESEND_INVITATION') | translate }}
        </button>
      </div>

      <!-- Submit -->
      <button
        class="acm-submit-btn"
        type="button"
        (click)="sendInvitation()"
        [disabled]="!canSubmit || pendingInvitation"
      >
        {{ isSending
          ? ('SENDING' | translate)
          : ('SEND_INVITATION' | translate) }}
      </button>

    </div>
  </div>
</div>
