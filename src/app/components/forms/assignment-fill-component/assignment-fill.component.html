<div class="page" *ngIf="!loading(); else loadingTpl">
  <div class="assignment-header">
    <button class="app-page-back" type="button" [attr.aria-label]="'BACK' | translate" (click)="goBack()"><span aria-hidden="true">←</span></button>
    <h1 class="title">{{ form.title }}</h1>
  </div>

  <div *ngIf="error()" class="alert">{{ error() }}</div>

  <form (ngSubmit)="submit()">
    <div class="q" *ngFor="let q of form.questions; let i = index">
      <label class="q-label">{{ i + 1 }}. {{ q.label }} *</label>

      <!-- TEXT -->
      <input
        *ngIf="q.type === 'TEXT'"
        class="field"
        type="text"
        [(ngModel)]="answers[i].text"
        [name]="'q' + i"
        required
      />

      <!-- MULTIPLE_CHOICE -->
      <select
        *ngIf="q.type === 'MULTIPLE_CHOICE'"
        class="field"
        [(ngModel)]="answers[i].selectedOptionId"
        [name]="'q' + i"
        required
      >
        <option [ngValue]="null">-- {{ 'CHOOSE_OPTION' | translate }} --</option>
        <option *ngFor="let o of (q.options || [])" [ngValue]="o.id">{{ o.label }}</option>
      </select>

      <!-- YES_NO -->
      <select
        *ngIf="q.type === 'YES_NO'"
        class="field"
        [(ngModel)]="answers[i].yes"
        [name]="'q' + i"
        required
      >
        <option [ngValue]="null">-- {{ 'CHOOSE_OPTION' | translate }} --</option>
        <option [ngValue]="true">{{ 'YES' | translate }}</option>
        <option [ngValue]="false">{{ 'NO' | translate }}</option>
      </select>

      <!-- DATE -->
      <input
        *ngIf="q.type === 'DATE'"
        class="field"
        type="date"
        [(ngModel)]="answers[i].date"
        [name]="'q' + i"
        required
      />

      <!-- STAR_RATING -->
      <select
        *ngIf="q.type === 'STAR_RATING'"
        class="field"
        [(ngModel)]="answers[i].rating"
        [name]="'q' + i"
        required
      >
        <option [ngValue]="null">-- {{ 'CHOOSE_OPTION' | translate }} --</option>
        <option *ngFor="let s of [1,2,3,4,5]" [ngValue]="s">{{ s }}</option>
      </select>
    </div>

    <button class="btn" type="submit" [disabled]="submitting()">
      {{ submitting() ? ('SENDING' | translate) : ('SUBMIT' | translate) }}
    </button>
  </form>
</div>

<ng-template #loadingTpl>
  <div class="loading">{{ 'LOADING' | translate }}</div>
</ng-template>
