<div class="website-leads-container">
  <div class="page-header">
    <h1>Website Leads</h1>
    <button class="btn-primary" type="button">
      <i-feather name="users"></i-feather>
      {{ totalElements }} Leads
    </button>
  </div>

  <div class="search-container">
    <div class="search-box">
      <i-feather name="search" class="search-icon"></i-feather>
      <input
        type="text"
        placeholder="Search leads..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        class="search-input"
      />
    </div>
  </div>

  <div class="plans-table">
    <div class="table-header">
      <div class="col-title">LEAD</div>
      <div class="col-updated">DATE</div>
      <div class="col-macros">CONTACT</div>
      <div class="col-calories">SOURCE</div>
      <div class="col-actions">ACTIONS</div>
    </div>

    <div class="table-row" *ngFor="let lead of leads">
      <div class="col-title">
        <div class="plan-name">{{ getLeadFullName(lead) }}</div>
        <div class="plan-type">{{ lead.slug }}</div>
      </div>

      <div class="col-updated">
        {{ formatDate(lead.createdAt) }}
      </div>

      <div class="col-macros">
        <div class="macro-item">{{ lead.email }}</div>
        <div class="macro-item">{{ lead.phone || 'No phone' }}</div>
      </div>

      <div class="col-calories">
        {{ lead.sourceTheme || '—' }}
      </div>

      <div class="col-actions">
        <div class="dropdown" [class.open]="openDropdownId === lead.id">
          <button
            class="actions-btn"
            (click)="toggleDropdown(lead.id, $event)"
            type="button"
          >
            Actions
            <i-feather name="chevron-down"></i-feather>
          </button>

          <div class="dropdown-menu" *ngIf="openDropdownId === lead.id">
            <button
              class="dropdown-item"
              type="button"
              (click)="copyEmail(lead.email); $event.stopPropagation()"
            >
              <i-feather name="copy"></i-feather>
              Copy email
            </button>

            <button
              class="dropdown-item"
              type="button"
              [disabled]="!lead.phone"
              (click)="copyPhone(lead.phone); $event.stopPropagation()"
            >
              <i-feather name="phone"></i-feather>
              Copy phone
            </button>

            <a
              class="dropdown-item"
              [href]="'mailto:' + lead.email"
              (click)="$event.stopPropagation()"
            >
              <i-feather name="mail"></i-feather>
              Send email
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!loading && leads.length === 0">
      No leads found.
    </div>

    <div class="loading-state" *ngIf="loading">
      Loading leads...
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button class="page-btn" [disabled]="page === 0" (click)="goToPage(page - 1)">
      Previous
    </button>

    <button
      class="page-btn"
      *ngFor="let p of pages"
      [class.active]="p === page"
      (click)="goToPage(p)"
    >
      {{ p + 1 }}
    </button>

    <button class="page-btn" [disabled]="page === totalPages - 1" (click)="goToPage(page + 1)">
      Next
    </button>
  </div>
</div>
