<main class="public-page">
  <div class="state-message" *ngIf="loading">{{ 'LOADING' | translate }}</div>
  <div class="state-message state-message--error" *ngIf="!loading && error && !form">{{ error }}</div>

  <ng-container *ngIf="form && !loading">
    <section class="contact-card">
      <div class="cover" [style.backgroundImage]="form.coverImage ? 'url(' + form.coverImage + ')' : ''"></div>
      <div class="avatar"><i-feather name="user"></i-feather></div>

      <div class="card-body">
        <h1>{{ form.message }}</h1>
        <div class="coach-name">{{ form.coachName }}</div>

        <form *ngIf="!submitted" (ngSubmit)="submit()" #contactForm="ngForm" novalidate>
          <label for="fullName">{{ 'FULL_NAME' | translate }}</label>
          <input id="fullName" name="fullName" type="text" maxlength="100" [(ngModel)]="lead.fullName" (blur)="touched.fullName = true" />
          <div class="field-error" *ngIf="touched.fullName && fullNameError">{{ fullNameError }}</div>

          <label for="email">{{ 'EMAIL' | translate }}</label>
          <input id="email" name="email" type="email" maxlength="254" [(ngModel)]="lead.email" (blur)="touched.email = true" />
          <div class="field-error" *ngIf="touched.email && emailError">{{ emailError }}</div>

          <label for="message">{{ 'MESSAGE' | translate }}</label>
          <textarea id="message" name="message" maxlength="2000" rows="4" [(ngModel)]="lead.message" (blur)="touched.message = true"></textarea>
          <div class="field-error" *ngIf="touched.message && messageError">{{ messageError }}</div>

          <!-- Honeypot: intentionally invisible to humans, available to naive bots/autofill. -->
          <div class="contact-honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" [(ngModel)]="lead.website" />
          </div>

          <label class="terms-row">
            <input name="terms" type="checkbox" [(ngModel)]="lead.termsAccepted" (blur)="touched.terms = true" />
            <span>{{ 'ACCEPT_TERMS_PREFIX' | translate }} <a href="https://yo-coach.app/terms" target="_blank" rel="noopener noreferrer">{{ 'TERMS_AND_CONDITIONS' | translate }}</a></span>
          </label>
          <div class="field-error" *ngIf="touched.terms && termsError">{{ termsError }}</div>

          <div class="form-error" *ngIf="error">{{ error }}</div>
          <div class="preview-note" *ngIf="isPreview">{{ 'PREVIEW_SUBMISSIONS_DISABLED' | translate }}</div>
          <button type="submit" [disabled]="!canSubmit || isPreview">{{ (submitting ? 'SENDING' : 'SEND') | translate }}</button>
        </form>

        <div class="confirmation" *ngIf="submitted">
          <div class="check-circle"><i-feather name="check"></i-feather></div>
          <p>Message sent successfully.</p>
        </div>
      </div>
    </section>
    <footer>{{ 'CREATED_WITH' | translate }} <strong>Yo Coach</strong></footer>
  </ng-container>
</main>
