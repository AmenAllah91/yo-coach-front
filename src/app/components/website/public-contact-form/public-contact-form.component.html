<main class="public-page">
  <div class="state-message" *ngIf="loading">Loading...</div>
  <div class="state-message state-message--error" *ngIf="!loading && error && !form">{{ error }}</div>

  <ng-container *ngIf="form && !loading">
    <section class="contact-card">
      <div class="cover" [style.backgroundImage]="form.coverImage ? 'url(' + form.coverImage + ')' : ''"></div>
      <div class="avatar"><i-feather name="user"></i-feather></div>

      <div class="card-body">
        <h1>{{ form.message }}</h1>
        <div class="coach-name">{{ form.coachName }}</div>

        <form *ngIf="!submitted" (ngSubmit)="submit()" #contactForm="ngForm">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" required maxlength="100" [(ngModel)]="lead.fullName" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required email maxlength="160" [(ngModel)]="lead.email" />

          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="1000" rows="4" [(ngModel)]="lead.message"></textarea>

          <label class="terms-row">
            <input name="terms" type="checkbox" [(ngModel)]="lead.termsAccepted" />
            <span>I have read and I accept the <a href="/terms-and-conditions" target="_blank">terms and conditions</a></span>
          </label>

          <div class="form-error" *ngIf="error">{{ error }}</div>
          <div class="preview-note" *ngIf="isPreview">Preview mode — submissions are disabled.</div>
          <button type="submit" [disabled]="!canSubmit || isPreview">{{ submitting ? 'Sending...' : 'Send' }}</button>
        </form>

        <div class="confirmation" *ngIf="submitted">
          <div class="check-circle"><i-feather name="check"></i-feather></div>
          <p>Your request has been submitted. You will receive an email when the coach accepts or declines your request.</p>
        </div>
      </div>
    </section>
    <footer>Created with <strong>Yo Coach</strong></footer>
  </ng-container>
</main>
